services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: stikstof
      POSTGRES_USER: stikstof
      POSTGRES_PASSWORD: stikstof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  pgdata:
